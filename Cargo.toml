[package]
name = "music-player-rs"
version = "0.3.0"
edition = "2021"

[dependencies]
rfd = "0.17"
symphonia = { version = "0.6", features = ["flac", "wav", "aiff", "pcm", "mp3", "ogg", "aac", "alac", "isomp4", "vorbis", "adpcm"] }
ureq = { version = "2", features = ["tls"] }
serde_json = "1"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
walkdir = "2"
ksni = "0.3.6"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }
rand = "0.8"
slint = { version = "1.17", default-features = false, features = [
    "std", 
    "compat-1-2", 
    "backend-winit-x11",     # Оставляем для поддержки X11 сессий
    "backend-winit-wayland", # КРИТИЧЕСКИ ВАЖНО: включает нативный Wayland
    "renderer-winit-skia-opengl" # Гарантирует аппаратное GPU-ускорение через OpenGL
] }
rtrb = "0.4.0"
rustfft = "6.4.1"
image = { version = "0.25", default-features = false, features = ["png"] }
clru = "0.6"
smallvec = "1.16"

# Системные вызовы модуля ФС (ADR-4, ADR-6): `O_DIRECTORY`, `F_FULLFSYNC`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Резервирование ReserveDevice1 через сессионную шину (ADR-08, §6.6).
# zbus собирается с бэкендом tokio (feature-унификация через ksni): диспетчер
# объектов запускается на собственном рантайме службы (rt-multi-thread).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

# `MoveFileExW` с `MOVEFILE_WRITE_THROUGH` (ADR-4).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# Линтер прод-кода (AM1.0 §6.29, §7.7, ТЗ-101): deny; в тестах unwrap/expect
# разрешены через clippy.toml, unreachable! в тестах не используется.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
