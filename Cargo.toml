[package]
name = "music-player-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
rfd = "0.17"
symphonia = { version = "0.6", features = ["flac", "wav", "aiff", "pcm", "mp3", "ogg", "aac", "alac", "isomp4", "vorbis", "adpcm"] }
ureq = { version = "2", features = ["tls"] }
serde_json = "1"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
walkdir = "2"
ksni = "0.3.6"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }
rand = "0.8"
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-winit-skia"] }
rtrb = "0.4.0"
rustfft = "6.4.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = true
