[package]
name = "music-player-rs"
version = "0.3.0"
edition = "2021"

[dependencies]
rfd = "0.17"
symphonia = { version = "0.6", features = ["flac", "wav", "aiff", "pcm", "mp3", "ogg", "aac", "alac", "isomp4", "vorbis", "adpcm"] }
ureq = { version = "2", features = ["tls"] }
serde_json = "1"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
walkdir = "2"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "signal"] }
rand = "0.8"
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-x11",     # Оставляем для поддержки X11 сессий
    "backend-winit-wayland", # КРИТИЧЕСКИ ВАЖНО: включает нативный Wayland
    "renderer-winit-skia-opengl", # Гарантирует аппаратное GPU-ускорение через OpenGL
    "raw-window-handle-06" # Определение Wayland-сессии для геометрии окна (ADR-22, §6.17)
] }
raw-window-handle = "0.6"
rtrb = "0.4.0"
rustfft = "6.4.1"
# Нормализация NFC ключей сравнения плейлиста (ОВС-3 а, §6.14).
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
clru = "0.6"
smallvec = "1.16"

# Системные вызовы модуля ФС (ADR-4, ADR-6): `O_DIRECTORY`, `F_FULLFSYNC`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Резервирование ReserveDevice1 через сессионную шину (ADR-08, §6.6).
# zbus собирается с бэкендом tokio (feature-унификация через ksni): диспетчер
# объектов запускается на собственном рантайме службы (rt-multi-thread).
[target.'cfg(target_os = "linux")'.dependencies]
# Трей StatusNotifier — только Linux (ADR-6, В-1).
ksni = "0.3.6"
zbus = "5.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

# Метод делегата `applicationShouldTerminate:` (ADR-7 п. 5): версия objc2 —
# как у winit 0.30.13.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

# `MoveFileExW` с `MOVEFILE_WRITE_THROUGH` (ADR-4); `SetWindowSubclass` для
# завершения сеанса (ADR-7 п. 4).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Линтер прод-кода (AM1.0 §6.29, §7.7, ТЗ-101): deny; в тестах unwrap/expect
# разрешены через clippy.toml, unreachable! в тестах не используется.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
