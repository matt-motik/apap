dod: >
  Все английские пользовательские строки из описи T1.0-B2 (ROADMAP.md: ui/settings.slint ~108,
  ui/app.slint ~62, ui/top_panel.slint, ui/status.slint, ui/playlist.slint, трей, фильтры rfd.rs,
  плюс найденные по ходу в src/app/*) переведены на русский — Slint через @tr(...) (в т.ч. форма
  множественного числа), Rust через src/i18n/ (named-placeholder конструкторы, плюральный хелпер
  3 формы, форматирование чисел/единиц, перечисление своих ошибок, обёртка системных ошибок).
  Технические термины/форматы/палитры Magma-Viridis-Plasma-Inferno/окна Hann-Hamming-Blackman/
  ключи настроек/имена тем/теги треков не переводятся; Solid/Gray/Rainbow/Thermal переведены
  («Сплошная»/«Серая»/«Радуга»/«Тепловая»); логи остаются английскими; уже русские строки не
  трогаются. Заголовок окна «APAP — <трек>» / «APAP» через одну константу имени приложения.
  cargo test и cargo clippy по всему проекту зелёные; python tools/traceability_tool.py check
  зелёный. Находки вне описи — отдельной B-строкой (⬜ открыто), не молча.
